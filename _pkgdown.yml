url: https://mrc-ide.github.io/stareal/

template:
  bootstrap: 5
  bslib:
    primary: "#1d4e89"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}
  math-rendering: katex

navbar:
  structure:
    left: [intro, tutorials, method, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/crt76t.html
    tutorials:
      text: Tutorials
      menu:
      - text: "1. Mapping crt K76T in the Greater Horn of Africa"
        href: articles/crt76t.html
      - text: "2. Rare and emerging markers: k13 R561H"
        href: articles/k13-561h.html
      - text: "3. Covariates"
        href: articles/covariates.html
      - text: "4. Cross-validation and model comparison"
        href: articles/crossval.html
      - text: "5. Simulate, fit, check"
        href: articles/simulation.html
    method:
      text: Method
      href: articles/method.html

articles:
- title: Tutorials
  navbar: ~
  desc: >
    Each tutorial answers one question with real or simulated data, from start to finish.
  contents:
  - articles/crt76t
  - articles/k13-561h
  - articles/covariates
  - articles/crossval
  - articles/simulation
- title: Method
  contents:
  - articles/method

reference:
- title: Space and time
  contents:
  - areal_frame
  - areal_lattice
  - plot.stareal_frame
  - time_frame
  - time_index
- title: Data
  contents:
  - areal_data
  - plot.stareal_data
  - simulate_areal
- title: Fitting
  contents:
  - fit_areal
  - trend
  - areal_priors
  - mcmc_control
  - summary.stareal_fit
  - diagnose
  - plot.stareal_fit
  - as_draws.stareal_fit
- title: Prediction and checking
  contents:
  - predict.stareal_fit
  - plot.stareal_pred
  - as.data.frame.stareal_pred
  - st_as_sf.stareal_pred
  - crossval
  - compare_cv
- title: Example data
  desc: Drug-resistance surveys in the eight IGAD countries.
  contents:
  - igad_crt76t
- title: Package
  contents:
  - stareal-package
